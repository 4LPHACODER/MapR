name: mapr
x-app: &app
  user: www-data
  image: mapr-app:${IMAGE_TAG:-latest}
  build:
    context: .
    dockerfile: docker/Dockerfile
    target: production
  env_file: ${MAPR_ENV_FILE:-.env.docker.production}
  environment:
    XDG_CONFIG_HOME: /tmp/mapr-config
    MAPR_EXPECTED_ENV: production
    APP_DEBUG: "false"
    DB_CONNECTION: mysql
    DB_HOST: db
    DB_PORT: 3306
    QUEUE_CONNECTION: database
    DB_QUEUE_RETRY_AFTER: "180"
    SESSION_SECURE_COOKIE: "true"
  volumes:
    - uploads:/var/www/html/storage/app
  depends_on:
    db:
      condition: service_healthy
  restart: unless-stopped
services:
  app:
    <<: *app
    healthcheck:
      test: [CMD, php, -r, 'exit(@fsockopen("127.0.0.1", 9000) === false ? 1 : 0);']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
  queue:
    <<: *app
    command: [php, artisan, queue:work, --sleep=3, --tries=3, --timeout=120, --max-time=3600]
    stop_grace_period: 150s
  web:
    image: mapr-web:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: web
    ports:
      - "127.0.0.1:${MAPR_HTTP_PORT:-8000}:80"
    volumes:
      - uploads:/var/www/html/storage/app:ro
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
  db:
    image: mysql:8.4
    env_file: ${MAPR_ENV_FILE:-.env.docker.production}
    environment:
      MAPR_EXPECTED_ENV: production
    # Map credentials inside the container, from the same file as app/queue.
    # Re-enter the official entrypoint with mysqld to retain first-run setup.
    command:
      - sh
      - -ec
      - |
        if [ "$${APP_ENV:-}" != "$$MAPR_EXPECTED_ENV" ]; then
          echo 'APP_ENV does not match this Compose stack; check MAPR_ENV_FILE.' >&2
          exit 1
        fi
        export MYSQL_DATABASE="$${DB_DATABASE:?Set DB_DATABASE in the Docker env file}"
        export MYSQL_USER="$${DB_USERNAME:?Set a non-root DB_USERNAME in the Docker env file}"
        export MYSQL_PASSWORD="$${DB_PASSWORD:?Set DB_PASSWORD in the Docker env file}"
        : "$${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in the Docker env file}"
        exec docker-entrypoint.sh mysqld --log-bin-trust-function-creators=1
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$DB_PASSWORD" mysql -h 127.0.0.1 -u "$$DB_USERNAME" "$$DB_DATABASE" -e "SELECT 1" >/dev/null 2>&1']
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 30s
    restart: unless-stopped
volumes:
  mysql-data:
  uploads:
