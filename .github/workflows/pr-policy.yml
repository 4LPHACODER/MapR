name: PR policy

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [develop, testing, main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  branch-flow:
    name: Branch flow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check promotion path
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          scripts/ci/check-branch-flow.sh "$BASE_REF" "$HEAD_REF"
          if [[ "$BASE_REF" != develop && "$HEAD_REPOSITORY" != "$GITHUB_REPOSITORY" ]]; then
            echo '::error::Promotions must originate in this repository.'
            exit 1
          fi

  commit-messages:
    name: Commit messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check pull request title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "$PR_TITLE" > "$RUNNER_TEMP/title.txt"
          scripts/ci/check-commit-message.sh "$RUNNER_TEMP/title.txt"
      - name: Check commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          status=0
          git rev-list --no-merges "$BASE_SHA..$HEAD_SHA" > "$RUNNER_TEMP/commits.txt"
          while IFS= read -r sha; do
            git log -1 --format=%B "$sha" > "$RUNNER_TEMP/message.txt"
            if ! scripts/ci/check-commit-message.sh "$RUNNER_TEMP/message.txt"; then
              echo "::error::Commit $sha has an invalid message"
              status=1
            fi
          done < "$RUNNER_TEMP/commits.txt"
          exit "$status"
