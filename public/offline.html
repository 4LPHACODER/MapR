<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#123b70">
    <title>You’re offline — MapR</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #f5f7fb;
            color: #172033;
            font: 1rem/1.5 Roboto, Arial, sans-serif;
        }

        main {
            max-width: 24rem;
            margin: 1rem;
            padding: clamp(1.25rem, 6vw, 2rem);
            border: 1px solid #e2e8f0;
            border-top: 4px solid #123b70;
            border-radius: .5rem;
            background: #fff;
        }

        h1 { margin: 0; color: #123b70; line-height: 1.2; }
        p { margin: .75rem 0 1.25rem; }

        button {
            min-height: 44px;
            border: 0;
            border-radius: .5rem;
            padding: .5rem 1rem;
            background: #123b70;
            color: #fff;
            font: inherit;
            cursor: pointer;
        }

        button:focus-visible { outline: 3px solid #2563eb; outline-offset: 3px; }
    </style>
</head>
<body>
    <main>
        <h1>You’re offline</h1>
        <p>Connect to the internet to continue using MapR.</p>
        <button type="button" id="retry">Try again</button>
    </main>
    <script>
        document.getElementById('retry').addEventListener('click', () => location.reload());
    </script>
</body>
</html>
